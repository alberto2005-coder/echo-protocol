[package]
name = "echo-protocol"
version = "1.0.0"
description = "Echo Protocol — 3D first-person cyber combat FPS"
authors = ["Alberto Ortiz"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
